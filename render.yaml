# Render Blueprint（可选）
# 在 Render Dashboard → New → Blueprint 选本仓库即可。
# 也可手动 New Web Service，不必用本文件。

services:
  - type: web
    name: pr-intent-checker
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_APP_SLUG
        value: pr-intent-checker
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
